name: Autonomous UI/UX QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Run nightly

jobs:
  test:
    name: Run Autonomous Agent
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps
        
    - name: Start Demo App (Background)
      run: |
        python -m http.server 8080 --directory demo_app &
        # Wait for server to start
        sleep 3
        
    - name: Run E2E Smoke Test (Heuristic Mode)
      run: |
        python -m backend.cli "Add a product to the shopping cart" "http://127.0.0.1:8080/store.html" \
          --mode goal_directed \
          --device desktop \
          --headless
          
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-audit-reports
        path: |
          reports/
          screenshots/
          sessions/
        retention-days: 7
